<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container pb-5">

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Your Notes</h1>
            <p class="text-muted mb-0">
                Signed in as <span th:text="${loggedUser.username}"></span>
            </p>
        </div>
        <a href="/notes/new" class="btn btn-primary">New Note</a>
    </div>

    <form th:action="@{/notes/search}" method="get" class="mb-4">
        <div class="input-group">
            <input class="form-control"
                   type="text"
                   name="query"
                   th:value="${searchQuery}"
                   placeholder="Search by title, content, or tags...">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
            <a th:if="${searchQuery != null and !#strings.isEmpty(searchQuery)}"
               href="/notes"
               class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <!-- Empty State -->
    <div th:if="${(notes == null or notes.isEmpty()) and (searchResults == null or searchResults.isEmpty())}" class="alert alert-light border">
        <span th:if="${searchQuery != null and !#strings.isEmpty(searchQuery)}">
            No notes matched your search.
        </span>
        <span th:unless="${searchQuery != null and !#strings.isEmpty(searchQuery)}">
            You have no notes yet. Create your first one.
        </span>
    </div>

    <!-- Hybrid Search Results -->
    <div th:if="${searchResults != null and !searchResults.isEmpty()}" class="row g-3">
        <div class="col-12 mb-2">
            <h2 class="h5 text-primary">Top Matches</h2>
        </div>
        <div class="col-md-6 col-lg-4" th:each="result : ${searchResults}">
            <div class="card h-100 shadow-sm border-primary">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${result.title}"></h5>
                        <span class="badge bg-light text-primary border" 
                              th:text="${#numbers.formatDecimal(result.score * 100, 1, 0)} + '% match'"></span>
                    </div>
                    
                    <div class="mb-2">
                        <span th:each="tag : ${result.tags}" 
                              class="badge rounded-pill bg-light text-secondary border me-1" 
                              th:text="${tag}"></span>
                    </div>

                    <div class="card-text text-muted flex-grow-1 small mb-3">
                        <div th:if="${result.highlight != null}" th:utext="${result.highlight}"></div>
                        <div th:unless="${result.highlight != null}" th:text="${#strings.abbreviate(result.content, 120)}"></div>
                    </div>

                    <div class="note-meta mb-3 x-small text-muted">
                        <div>Updated: <span th:text="${#temporals.format(result.updatedAt, 'MMM d, yyyy HH:mm')}"></span></div>
                    </div>
                    <a th:href="@{/notes/{id}(id=${result.id})}" class="btn btn-primary btn-sm align-self-start">
                        View Memory
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Regular Note List (Home) -->
    <div th:if="${notes != null and !notes.isEmpty()}" class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="note : ${notes}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${note.title}"></h5>
                    <div th:replace="~{fragments/layout :: tags(${note})}"></div>
                    <p class="card-text text-muted flex-grow-1"
                       th:text="${#strings.abbreviate(note.content, 120)}"></p>
                    <div class="note-meta mb-3">
                        <div>Created: <span th:text="${#temporals.format(note.createdAt, 'MMM d, yyyy HH:mm')}"></span></div>
                        <div>Updated: <span th:text="${#temporals.format(note.updatedAt, 'MMM d, yyyy HH:mm')}"></span></div>
                    </div>
                    <a th:href="@{/notes/{id}(id=${note.id})}" class="btn btn-outline-primary btn-sm align-self-start">
                        Open
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
