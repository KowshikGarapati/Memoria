# ==========================================
# APPLICATION
# ==========================================
spring.application.name=Memoria

# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/memoria
spring.datasource.username=kowshik
spring.datasource.password=memoria123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# AI CONFIGURATION
# ==========================================
# Embeddings (Ollama)
application.ai.ollama.url=http://localhost:11434
application.ai.ollama.model=nomic-embed-text
application.ai.ollama.dimensions=768

# Summaries (Anthropic)
application.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
application.ai.anthropic.model=claude-3-5-sonnet-20240620

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# SECURITY (JWT)
# ==========================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

