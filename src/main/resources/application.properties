# ==========================================
# APPLICATION
# ==========================================
spring.application.name=Memoria

# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/memoria
spring.datasource.username=kowshik
spring.datasource.password=memoria123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# AI CONFIGURATION
# ==========================================
# Embeddings (Ollama)
application.ai.ollama.url=http://127.0.0.1:11434
application.ai.ollama.model=nomic-embed-text
application.ai.ollama.dimensions=768

# Summaries & Chat (Ollama)
application.ai.ollama.summary-model=llama3.2
application.ai.ollama.chat-model=llama3.2

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# SECURITY (JWT)
# ==========================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# ==========================================
# FILE UPLOADS
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false